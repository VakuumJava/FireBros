      >
        <h1>Ala-Too Fire Atlas</h1>
        <p>
          Explore monthly fire activity in Kyrgyzstan and neighbouring mountain
          regions. Choose an area on the map and compare a month with the
          satellite archive to understand its historical context.
        </p>
        <p>
          The atlas uses NASA FIRMS observations from MODIS and VIIRS.
          Calibrated estimates help compare these sensors on a shared
          measurement scale, with uncertainty and coverage information alongside
          the results. A satellite hotspot is a thermal anomaly, not a confirmed
          wildfire.
        </p>
        <p>
          Enable JavaScript to use the map, activity calendar, historical
          comparison and CSV downloads. Read about the observations at
          <a href="https://firms.modaps.eosdis.nasa.gov/">NASA FIRMS</a>.
        </p>
      </main>
