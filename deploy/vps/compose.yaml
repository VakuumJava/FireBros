services:
  app:
    image: vakuum-firebros:${FIREBROS_RELEASE:?Set FIREBROS_RELEASE}
    environment:
      FIREBROS_DATA_DIR: /data
      FIREBROS_REQUIRE_DATA: "true"
      FIREBROS_CORS: ""
      FIREBROS_MAX_CONCURRENT_QUERIES: "8"
    volumes:
      - ${FIREBROS_RELEASE_DIR:?Set FIREBROS_RELEASE_DIR}/data/processed:/data:ro
    networks:
      edge:
        aliases:
          - vakuum-firebros-api
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 128
    ulimits:
      nofile:
        soft: 1024
        hard: 1024
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    restart: unless-stopped

networks:
  edge:
    external: true
    name: vakuum-space_edge
