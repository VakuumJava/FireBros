[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "data", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["S101", "S608"]
"backend/app/deps.py" = ["B008"]
"backend/app/routers/*" = ["B008"]
"backend/app/store/mock.py" = ["S311"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning"]